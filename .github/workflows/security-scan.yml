name: security-scan (DAST)

# ZAP baseline scan against a self-contained demo target (OWASP Juice Shop).
# TEMPLATE: to scan your own app, replace the target with your AUTHORIZED
# staging URL (and use a self-hosted runner if it is internal-only).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    services:
      juiceshop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - name: Wait for the demo target to be ready
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "Target is up."; exit 0
            fi
            echo "waiting... ($i)"; sleep 5
          done
          echo "Target did not become ready in time"; exit 1

      - name: Run ZAP baseline scan
        run: |
          mkdir -p "$GITHUB_WORKSPACE/report"
          chmod -R 777 "$GITHUB_WORKSPACE/report"
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE/report:/zap/wrk:rw" \
            --user root \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:3000 -r zap_report.html \
            || echo "ZAP found issues (non-zero exit) - report still produced."
          echo "--- report directory ---"
          ls -la "$GITHUB_WORKSPACE/report"

      - name: Upload the scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: report/zap_report.html
          if-no-files-found: warn
