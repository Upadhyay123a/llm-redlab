name: security-scan (DAST)

# ZAP baseline scan against a self-contained demo target (OWASP Juice Shop).
# TEMPLATE: to scan your own app, replace the target with your AUTHORIZED
# staging URL (and use a self-hosted runner if it is internal-only).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 3 * * 1"   # optional: weekly, Monday 03:00 UTC

permissions:
  contents: read
  issues: write            # the ZAP action can open an issue with findings

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    services:
      juiceshop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000
    steps:
      - name: Wait for the demo target to be ready
        run: |
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://localhost:3000; then
              echo "Target is up."; exit 0
            fi
            echo "waiting... ($i)"; sleep 5
          done
          echo "Target did not become ready in time"; exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          cmd_options: "-a"
          fail_action: false        # report, do not fail the build
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"
