# llm-redlab - an AI/LLM security lab (sandboxed, clone-and-run).
[project]
name = "llm-redlab"
version = "0.1.0"
description = "Red-teams LLM & RAG apps against built-in vulnerable targets, scores findings, and generates remediations."
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0", "rich>=13.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
